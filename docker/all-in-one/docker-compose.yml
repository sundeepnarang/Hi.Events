services:
  all-in-one:
    build:
      context: ./../../
      dockerfile: Dockerfile.all-in-one
    container_name: all-in-one
    restart: always
    ports:
      - 9090:80
    volumes:
      - ./storage:/app/backend/storage
    networks:
      - hi-events-network
    environment:
      - APP_NAME=${APP_NAME}
      - API_ACCESS_TOKEN=${API_ACCESS_TOKEN}
      - API_ALLOWED_IPS=${API_ALLOWED_IPS}
      - VITE_FRONTEND_URL=${VITE_FRONTEND_URL}
      - VITE_API_URL_CLIENT=${VITE_API_URL_CLIENT}
      - VITE_API_URL_SERVER=${VITE_API_URL_SERVER}
      - VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY}
      - VITE_META_PIXEL_ID=${VITE_META_PIXEL_ID}
      - VITE_GOOGLE_ANALYTICS_ID=${VITE_GOOGLE_ANALYTICS_ID:-}
      - VITE_GOOGLE_ADS_CONVERSION_ID=${VITE_GOOGLE_ADS_CONVERSION_ID:-}
      - VITE_GOOGLE_ADS_CONVERSION_LABELS=${VITE_GOOGLE_ADS_CONVERSION_LABELS:-}
      - VITE_APP_NAME=${VITE_APP_NAME}
      - VITE_DATA_COLLECTION_DISCLAIMER=${VITE_DATA_COLLECTION_DISCLAIMER}
      - VITE_COOKIE_CONSENT_ENABLED=${VITE_COOKIE_CONSENT_ENABLED:-}
      - VITE_COOKIE_CONSENT_DOMAIN=${VITE_COOKIE_CONSENT_DOMAIN:-}
      - VITE_COOKIE_CONSENT_TEXT=${VITE_COOKIE_CONSENT_TEXT:-}
      - LOG_CHANNEL=${LOG_CHANNEL}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION}
      - APP_KEY=${APP_KEY}
      - APP_CDN_URL=${APP_CDN_URL}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL}
      - JWT_SECRET=${JWT_SECRET}
      - APP_DISABLE_REGISTRATION=${APP_DISABLE_REGISTRATION}
      - APP_SAAS_MODE_ENABLED=${APP_SAAS_MODE_ENABLED}
      - APP_LICENCE_KEY=${APP_LICENCE_KEY:-}
      - APP_TRUSTED_PROXIES=${APP_TRUSTED_PROXIES:-*}
      - APP_SSR_SHARED_SECRET=${APP_SSR_SHARED_SECRET:-}
      - APP_PUBLIC_ORDER_RATE_LIMIT_PER_MINUTE=${APP_PUBLIC_ORDER_RATE_LIMIT_PER_MINUTE:-60}
      - APP_PUBLIC_PROMO_CODE_RATE_LIMIT_PER_MINUTE=${APP_PUBLIC_PROMO_CODE_RATE_LIMIT_PER_MINUTE:-10}
      - APP_SEAT_MAP_MAX_SEATS=${APP_SEAT_MAP_MAX_SEATS:-3000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - APP_SAAS_STRIPE_APPLICATION_FEE_PERCENT=${APP_SAAS_STRIPE_APPLICATION_FEE_PERCENT}
      - APP_SAAS_STRIPE_APPLICATION_FEE_FIXED=${APP_SAAS_STRIPE_APPLICATION_FEE_FIXED}
      - APP_EMAIL_LOGO_URL=${APP_EMAIL_LOGO_URL}
      - APP_EMAIL_LOGO_LINK_URL=${APP_EMAIL_LOGO_LINK_URL}
      - MAIL_MAILER=${MAIL_MAILER}
      - MAIL_DRIVER=${MAIL_DRIVER}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION}
      - MAIL_AUTO_TLS=${MAIL_AUTO_TLS}
      - MAIL_VERIFY_PEER=${MAIL_VERIFY_PEER}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - GEO_PROVIDER=${GEO_PROVIDER}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - FILESYSTEM_PUBLIC_DISK=${FILESYSTEM_PUBLIC_DISK}
      - FILESYSTEM_PRIVATE_DISK=${FILESYSTEM_PRIVATE_DISK}
      - FILESYSTEM_DRIVER=local
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/sos-events-db
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - WEBHOOK_QUEUE_NAME=webhook-queue
      - DB_CONNECTION=pgsql

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:latest
    container_name: redis
    networks:
      - hi-events-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    ports:
      - 5432:5432
    networks:
      - hi-events-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-hi-events}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: sos-events-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

networks:
  hi-events-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
